<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amnezia Browser</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header"><div><h1>Amnezia Browser</h1><p>Маршруты выбранных доменов</p></div><span id="statusDot" class="status-dot" aria-hidden="true"></span></header>
    <section class="card"><span class="label">Текущий сайт</span><strong id="site">Загрузка…</strong><span id="ruleSource" class="hint"></span></section>
    <section class="card">
      <span class="label">Желаемый маршрут</span>
      <div class="route-buttons"><button id="directButton" type="button" aria-pressed="false" disabled>Direct</button><button id="vpnButton" type="button" aria-pressed="false" disabled>VPN</button></div>
      <button id="inheritButton" type="button" disabled>Удалить своё правило</button>
      <strong id="appliedStatus" role="status">Проверка применения…</strong>
      <span class="hint">При активных VPN-правилах остальные домены идут напрямую. Правила действуют во всех вкладках профиля.</span>
    </section>
    <section class="card compact"><span class="label">Подключение</span><strong id="backendStatus" role="status">Проверка…</strong><span id="probeStatus" class="hint">HTTP-проверка туннеля ещё не запускалась.</span><button id="probeButton" type="button">Проверить выход через Amnezia</button></section>
    <section id="updateCard" class="card" hidden><strong id="updateText"></strong><button id="updateButton" type="button">Открыть релиз</button></section>
    <p id="updateStatus" class="hint"></p>
    <button id="settingsButton" type="button">Настройки, правила и backend</button>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <p class="version">Версия <span id="version"></span></p>
  </main>
  <script src="routing.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
